# Snapcast 서버 설정 예 (MqttVLCPlayer용)
# sudo cp deploy/snapserver.conf /etc/snapserver.conf && sudo systemctl restart snapserver
#
# MqttVLCPlayer가 만드는 PipeWire/PulseAudio 싱크 "snapcast"가 이 FIFO에 소리를 쓴다.
# 포맷은 NUGU Candle 등 클라이언트와 맞춘 48000Hz/16bit/2ch, 코덱은 pcm(디코딩 부담 없음) 고정.
# 경로를 바꾸면 /etc/mqttvlcplayer.env의 SNAPCAST_FIFO도 같이 바꿀 것.

[stream]
source = pipe:///tmp/snapfifo?name=MqttVLCPlayer&sampleformat=48000:16:2&codec=pcm
# 재생 버퍼(ms). Wi-Fi 스피커가 끊기면 늘리고, 그만큼 SNAPCAST_AUDIO_DELAY_MS(립싱크)를 더 음수로
buffer = 400
chunk_ms = 20

[http]
# 1780 포트: 웹 UI와 JSON-RPC (Home Assistant Snapcast 통합이 사용)
enabled = true
