<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영상 재생 및 설정</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
        }
        h1 {
            text-align: center;
        }
        h2 {
            text-align: center;
        }
        .section {
            margin-bottom: 30px;
            width: 100%;
            max-width: 600px;
        }
        .btn {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            margin-right: 10px;
            width: 100%;
            max-width: 200px;
            margin-bottom: 10px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
        }
        .checkbox-group label {
            margin-right: 15px;
        }
        table {
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* 표 헤더 스타일 */
        th {
            background-color: #007bff;
            color: #fff;
            padding: 12px 15px;
            text-align: left;
        }

        /* 표 본문 스타일 */
        td {
            padding: 12px 15px;
            text-align: left;
            border-top: 1px solid #ddd;
        }
    </style>
</head>
<body>

    <h1>영상 재생 및 설정</h1>

    <!-- 설정 섹션 -->
    <div class="section">
        <h2>설정</h2>
        <form id="config-form">
            <div class="form-group">
                <label for="nas_folder">NAS 폴더 경로:</label>
                <input type="text" id="nas_folder" name="nas_folder" value="{{ config['nas_folder'] }}" required>
            </div>
            <button type="submit" class="btn">설정 저장</button>
        </form>
    </div>

    <!-- 제어 섹션 -->
    <div class="section">
        <h2>제어</h2>
        <button class="btn" data-url="/play_now" data-ok="영상을 재생합니다." data-fail="재생할 영상이 없거나 재생에 실패했습니다.">랜덤 재생 시작</button>
        <button class="btn" data-url="/stop_video" data-ok="영상이 종료되었습니다." data-fail="영상 종료에 실패했습니다.">영상 종료</button>
        <button class="btn" data-url="/on_tv" data-ok="TV 전원이 켜졌습니다." data-fail="TV 전원을 켜지 못했습니다.">TV ON</button>
        <button class="btn" data-url="/off_tv" data-ok="TV 전원이 꺼졌습니다." data-fail="TV 전원을 끄지 못했습니다.">TV OFF</button>
        <a href="{{ url_for('file_list') }}">
            <button class="btn">영상 목록 확인</button>
        </a>
    </div>

    <!-- 알림 소리 섹션 -->
    <div class="section">
        <h2>알림 소리</h2>
        <div class="form-group">
            <label for="sound-file">사운드 파일:</label>
            <select id="sound-file">
                {% for name in sound_files %}
                <option value="{{ name }}">{{ name }}</option>
                {% else %}
                <option value="">(sounds 폴더에 파일이 없습니다)</option>
                {% endfor %}
            </select>
            <button class="btn" id="sound-play">소리 재생</button>
        </div>
        <div class="form-group">
            <label for="tts-text">읽을 문장:</label>
            <input type="text" id="tts-text" placeholder="예: 현관문이 열렸습니다">
            <button class="btn" id="tts-say">음성 안내</button>
        </div>
        <button class="btn" data-url="/sound/stop" data-ok="알림 소리를 멈췄습니다." data-fail="알림 소리를 멈추지 못했습니다.">소리 멈춤</button>
    </div>

    <div class="section">
        <h2>현재 상태</h2>
        <table>
            <thead>
                <tr>
                    <th>항목</th>
                    <th>값</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>NAS 폴더 경로</td>
                    <td>{{ config['nas_folder'] }}</td>
                </tr>
                <tr>
                    <td>TV 전원</td>
                    <td>{% if tv_power is none %}알 수 없음{% elif tv_power %}켜짐{% else %}꺼짐{% endif %}</td>
                </tr>
                <tr>
                    <td>영상 재생</td>
                    <td>{% if playing %}재생 중{% else %}정지{% endif %}</td>
                </tr>
            </tbody>
        </table>
    </div>
    <!-- 설정 업데이트 및 제어 요청 -->
    <script>
        document.getElementById('config-form').addEventListener('submit', function(event) {
            event.preventDefault();

            const formData = new FormData(event.target);
            fetch('/update', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ nas_folder: formData.get('nas_folder') })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    alert("설정이 업데이트되었습니다.");
                    location.reload();
                } else {
                    alert(data.message || "설정 업데이트에 실패했습니다.");
                }
            })
            .catch(error => {
                console.error("설정 업데이트 오류:", error);
            });
        });

        function postJson(url, body, failMessage) {
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            })
            .then(response => {
                if (!response.ok) alert(failMessage);
            })
            .catch(error => {
                console.error("요청 오류:", error);
            });
        }

        document.getElementById('sound-play').addEventListener('click', function() {
            postJson('/sound/play', { file: document.getElementById('sound-file').value },
                     "사운드 파일을 재생하지 못했습니다.");
        });

        document.getElementById('tts-say').addEventListener('click', function() {
            postJson('/sound/say', { text: document.getElementById('tts-text').value },
                     "읽을 문장을 입력하세요.");
        });

        document.querySelectorAll('button[data-url]').forEach(function(button) {
            button.addEventListener('click', function() {
                fetch(button.dataset.url, { method: 'POST' })
                .then(response => {
                    alert(response.ok ? button.dataset.ok : button.dataset.fail);
                    location.reload();
                })
                .catch(error => {
                    console.error("요청 오류:", error);
                });
            });
        });
    </script>

</body>
</html>
