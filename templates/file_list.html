<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>영상 목록</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    <h1>영상 목록 <span class="hint">({{ video_files | length }}개)</span></h1>
    <a class="btn secondary" href="{{ url_for('index') }}">← 처음으로</a>
</header>

<main>
    <section class="card wide">
        {% if video_files %}
        <input type="text" id="filter" placeholder="이름으로 찾기">
        <ul class="list" id="videos">
            {% for video in video_files %}
            <li>
                <span class="name">{{ video | basename }}</span>
                <form action="/play_video" method="post">
                    <input type="hidden" name="video" value="{{ video | basename }}">
                    <button type="submit">재생</button>
                </form>
            </li>
            {% endfor %}
        </ul>
        {% else %}
        <p>영상 파일이 없습니다. 설정에서 영상(NAS) 폴더 경로를 확인하세요.</p>
        {% endif %}
    </section>
</main>

<script>
    // 입력한 글자가 들어간 영상만 보이기
    const filter = document.getElementById('filter');
    if (filter) {
        filter.addEventListener('input', function() {
            const query = filter.value.trim().toLowerCase();
            document.querySelectorAll('#videos li').forEach(item => {
                item.hidden = query && !item.textContent.toLowerCase().includes(query);
            });
        });
    }
</script>
</body>
</html>
